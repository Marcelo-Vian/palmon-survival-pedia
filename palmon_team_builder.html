<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=palmon_battle_simulator.html?mode=builder">
  <title>Redirecionando - Montar Time</title>
  <link rel="canonical" href="palmon_battle_simulator.html?mode=builder">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef5ff;
      --panel: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #d7e3f3;
      --primary: #2563eb;
      --shadow: 0 18px 34px rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 24%),
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 22%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(640px, 100%);
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.04;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      margin-top: 18px;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid #bfd7ff;
      background: linear-gradient(135deg, #2563eb, #5fd0ff);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecionando para o novo Montar Time</h1>
    <p>O montador agora usa o mesmo motor do simulador de batalha, com drag and drop, troca de slots, perks, skills individuais e sugestoes mais completas.</p>
    <a href="palmon_battle_simulator.html?mode=builder">Abrir Montar Time</a>
  </main>
  <script>
    window.location.replace('palmon_battle_simulator.html?mode=builder');
  </script>
</body>
</html>
